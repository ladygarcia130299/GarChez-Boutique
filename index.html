 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GarChéz Boutique</title>
  <meta name="description" content="GarChéz Boutique - Moda, ropa, calzado y accesorios en 🇳🇮 Nicaragua.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f7f5;
      color: #222;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* =========================
       BARRA SUPERIOR
    ========================= */

    .topbar {
      background: #171717;
      color: white;
      text-align: center;
      padding: 9px;
      font-size: 13px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: white;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-main {
      max-width: 1250px;
      margin: auto;
      padding: 14px 25px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      min-width: 250px;
    }

    .logo img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .brand-name {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      letter-spacing: .5px;
      color: #171717;
    }

    .brand-name small {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #a67c52;
      font-weight: 700;
    }

    .search {
      flex: 1;
      display: flex;
      background: #f2f2f2;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .search input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      padding: 14px 18px;
      font-size: 14px;
    }

    .search button {
      border: 0;
      background: #171717;
      color: white;
      padding: 0 22px;
    }

    .header-actions {
      display: flex;
      gap: 18px;
      font-size: 14px;
      white-space: nowrap;
    }

    nav {
      border-top: 1px solid #eee;
      background: white;
    }

    .nav-inner {
      max-width: 1250px;
      margin: auto;
      padding: 13px 25px;
      display: flex;
      gap: 30px;
      font-size: 14px;
      font-weight: 600;
      overflow-x: auto;
    }

    .nav-inner a {
      white-space: nowrap;
    }

    .nav-inner a:hover {
      color: #a67c52;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 560px;
      background:
        linear-gradient(rgba(0,0,0,.40), rgba(0,0,0,.40)),
        url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 1250px;
      width: 100%;
      margin: auto;
      padding: 60px 25px;
      color: white;
    }

    .hero-logo {
      width: 115px;
      height: 115px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 22px;
      background: white;
    }

    .hero-content small {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 13px;
    }

    .hero-content h1 {
      font-size: clamp(45px, 7vw, 82px);
      line-height: .95;
      max-width: 700px;
      margin: 20px 0;
    }

    .hero-content p {
      font-size: 18px;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      border: 0;
      background: white;
      color: #171717;
      padding: 15px 28px;
      font-weight: 700;
      border-radius: 3px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       BENEFICIOS
    ========================= */

    .benefits {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .benefits-inner {
      max-width: 1250px;
      margin: auto;
      padding: 25px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .benefit {
      text-align: center;
      padding: 10px;
    }

    .benefit strong {
      display: block;
      margin-bottom: 6px;
    }

    .benefit span {
      color: #777;
      font-size: 13px;
    }

    /* =========================
       SECCIONES
    ========================= */

    .section {
      max-width: 1250px;
      margin: auto;
      padding: 70px 25px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title small {
      color: #a67c52;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-top: 10px;
    }

    /* =========================
       CATEGORÍAS
    ========================= */

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .category {
      height: 330px;
      position: relative;
      overflow: hidden;
      color: white;
      background: #ddd;
      cursor: pointer;
    }

    .category img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .category:hover img {
      transform: scale(1.05);
    }

    .category-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,.78));
      display: flex;
      align-items: flex-end;
      padding: 25px;
    }

    .category h3 {
      font-size: 25px;
    }

    /* =========================
       BOTONES DE CATEGORÍA
    ========================= */

    .category-menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 35px;
    }

    .category-btn {
      border: 1px solid #ddd;
      background: white;
      padding: 11px 18px;
      border-radius: 25px;
      font-weight: 600;
      transition: .2s;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #171717;
      color: white;
      border-color: #171717;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .product {
      background: white;
      border: 1px solid #eee;
      position: relative;
      overflow: hidden;
      transition: .25s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .product-image {
      height: 350px;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .product:hover img {
      transform: scale(1.04);
    }

    .product-info {
      padding: 18px;
    }

    .product-category {
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product h3 {
      font-size: 16px;
      margin: 8px 0;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      margin-left: 7px;
    }

    .product-short {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 8px;
    }

    .buy-btn {
      width: 100%;
      border: 0;
      background: #171717;
      color: white;
      padding: 13px;
      margin-top: 15px;
      font-weight: 700;
    }

    .buy-btn:hover {
      background: #a67c52;
    }

    .empty-products {
      text-align: center;
      padding: 50px 20px;
      color: #777;
      display: none;
      grid-column: 1 / -1;
    }

    /* =========================
       MODAL DEL PRODUCTO
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 3000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-image {
      min-height: 500px;
      background: #eee;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      min-height: 500px;
      object-fit: cover;
    }

    .modal-info {
      padding: 40px;
    }
